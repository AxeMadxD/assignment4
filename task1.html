<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Task 1 of Assignment 4: a train ticket booking form built with Bootstrap form components and restyled with my own CSS.">
    <title>Task 1. Book a train ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="qr-page">
        <div class="container">
            <a class="qr-back" href="index.html">&larr; All three tasks</a>

            <div class="qr-card">
                <header class="qr-card__head">
                    <h1>Book a train ticket</h1>
                </header>

                <form class="qr-card__body" action="#" method="get">
                    <div class="qr-seg" role="group" aria-label="Trip type">
                        <input type="radio" class="btn-check" name="trip" id="trip-one" value="one-way" checked>
                        <label class="btn" for="trip-one">One way</label>
                        <input type="radio" class="btn-check" name="trip" id="trip-round" value="round-trip">
                        <label class="btn" for="trip-round">Round trip</label>
                    </div>

                    <div class="row g-4 mt-1">
                        <div class="col-12 col-lg-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="from" name="from" placeholder="From" value="Astana" maxlength="40" required>
                                <label for="from">From</label>
                            </div>
                        </div>
                        <div class="col-12 col-lg-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="to" name="to" placeholder="To" value="Almaty" maxlength="40" required>
                                <label for="to">To</label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-4 mt-1">
                        <div class="col-12 col-md-4">
                            <label class="form-label" for="departure">Departure</label>
                            <input type="date" class="form-control" id="departure" name="departure" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label" for="return">Return</label>
                            <input type="date" class="form-control" id="return" name="return">
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label" for="passengers">Passengers</label>
                            <select class="form-select" id="passengers" name="passengers">
                                <option value="1" selected>1 adult</option>
                                <option value="2">2 adults</option>
                                <option value="3">3 adults</option>
                                <option value="4">4 adults</option>
                                <option value="5">5 adults</option>
                                <option value="6">6 adults</option>
                            </select>
                        </div>
                    </div>

                    <fieldset class="mt-5">
                        <legend class="qr-legend">Carriage class</legend>
                        <div class="d-flex flex-wrap gap-3 gap-sm-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="carriage" id="carriage-seat" value="seat" required>
                                <label class="form-check-label" for="carriage-seat">Seat</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="carriage" id="carriage-coupe" value="coupe" checked required>
                                <label class="form-check-label" for="carriage-coupe">Coup&eacute;</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="carriage" id="carriage-sleeper" value="sleeper" required>
                                <label class="form-check-label" for="carriage-sleeper">Sleeper</label>
                            </div>
                        </div>
                    </fieldset>

                    <div class="row g-4 mt-1">
                        <div class="col-12 col-lg-6">
                            <label class="form-label" for="phone">Phone</label>
                            <div class="input-group">
                                <span class="input-group-text" id="country-code">+7</span>
                                <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" inputmode="tel" maxlength="15" aria-describedby="country-code" autocomplete="tel" required>
                            </div>
                        </div>
                        <div class="col-12 col-lg-6">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
                        </div>
                    </div>

                    <div class="form-check form-switch mt-5">
                        <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes">
                        <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                    </div>

                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" id="rules" name="rules" value="yes" required>
                        <label class="form-check-label" for="rules">I agree with the carriage rules</label>
                    </div>

                    <div class="qr-actions d-flex flex-column flex-sm-row justify-content-sm-end gap-3 mt-5">
                        <button type="reset" class="btn qr-btn qr-btn--ghost order-2 order-sm-1">Clear</button>
                        <button type="submit" class="btn qr-btn qr-btn--primary order-1 order-sm-2">Find trains</button>
                    </div>
                </form>
            </div>

            <p class="qr-foot text-center mt-4 mb-0">Assignment 4, Task 1. Akhmad Zhagiparov, IT-2510.</p>
        </div>
    </main>
</body>
</html>
